[package]
name = "terrarium"
version = "0.2.6"
edition = "2024"
rust-version = "1.89"
default-run = "terrarium"
description = "A terminal dashboard for managing tofu-controller Terraform and Flux Kustomization resources in Kubernetes"
license = "GPL-3.0-or-later"
repository = "https://github.com/fenio/terrarium"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
jiff = "0.2.35"
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
kube = { version = "4.2.0", features = ["runtime", "derive", "client", "ws"] }
libc = "0.2"
ratatui = "0.30.2"
regex = "1"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9"
toml = "1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
